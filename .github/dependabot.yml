# Weekly updates, grouped so we get a few PRs instead of one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Mastra 1.x voice transcription accepts only AI SDK v2 transcription models; v4 breaks the build.
      - dependency-name: "@ai-sdk/openai"
        update-types: ["version-update:semver-major"]
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
